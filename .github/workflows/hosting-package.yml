name: Build package for own hosting

# Builds the site for a normal web host (cPanel, Hostinger, Niagahoster, etc.)
# where it lives at the root of the domain, e.g. https://www.tamuratrade.com/.
# Download the "tamura-website-hosting" artifact from the run and upload the
# files inside it to public_html.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci || npm install
      - name: Build static site (root of the domain)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run build
      - name: Add Apache settings
        run: |
          cat > out/.htaccess <<'HT'
          # Tamura Trade Indonesia website (static files)
          Options -Indexes
          DirectoryIndex index.html
          ErrorDocument 404 /404.html

          # Force HTTPS
          RewriteEngine On
          RewriteCond %{HTTPS} off
          RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]

          # Cache images, fonts, scripts and styles
          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType image/webp "access plus 1 month"
            ExpiresByType image/png "access plus 1 month"
            ExpiresByType image/jpeg "access plus 1 month"
            ExpiresByType font/woff "access plus 1 year"
            ExpiresByType text/css "access plus 1 year"
            ExpiresByType application/javascript "access plus 1 year"
          </IfModule>
          <IfModule mod_deflate.c>
            AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml
          </IfModule>
          HT
          sed -i 's/^          //' out/.htaccess
          rm -f out/.nojekyll
          du -sh out
      - uses: actions/upload-artifact@v4
        with:
          name: tamura-website-hosting
          path: out
          include-hidden-files: true
          retention-days: 90
