name: Fetch product images

# One-off helper: downloads manufacturer product photos and commits them.
# Runs when scripts/fetch_images.py changes, or by hand from the Actions tab.
on:
  push:
    branches: [main]
    paths: [scripts/fetch_images.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - run: python scripts/fetch_images.py
      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add downloaded product images"
          git push
